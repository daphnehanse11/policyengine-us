# Work requirement ineligibility attaches to the individual — 7 U.S.C.
# 2015(d)(1)(A) and (o)(2); 7 CFR 273.24(b)(1). The disqualified member
# is removed from the SNAP unit per 7 CFR 273.11(c), and the unit as a
# whole is ineligible only when no members remain eligible.

- name: Case 1, single ABAWD failing the work requirement makes a one-person unit ineligible.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 0
        is_disabled: false
    spm_units:
      spm_unit:
        members: [person1]
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    meets_snap_work_requirements_person: false
    meets_snap_work_requirements: false

- name: Case 2, mixed unit — one compliant member keeps the unit eligible while the ABAWD is disqualified individually.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 30
        is_disabled: false
      person2:
        age: 30
        weekly_hours_worked_before_lsr: 0
        is_disabled: false
    spm_units:
      spm_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    meets_snap_work_requirements_person: [true, false]
    meets_snap_work_requirements: true

- name: Case 3, unemployed non-exempt adult with a 10-year-old dependent meets the work requirements.
  period: 2026-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 0
        is_disabled: false
      person2:
        age: 10
        is_tax_unit_dependent: true
    spm_units:
      spm_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    meets_snap_work_requirements_person: [true, true]
    meets_snap_work_requirements: true

- name: Case 4, pre-HR1 non-dependent under-18 member exempts the unemployed adult.
  period: 2024-01
  input:
    people:
      person1:
        age: 30
        weekly_hours_worked_before_lsr: 0
        is_disabled: false
      person2:
        age: 17
        is_tax_unit_dependent: false
    spm_units:
      spm_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    meets_snap_work_requirements_person: [true, true]
    meets_snap_work_requirements: true

- name: Case 5, CA pre-HR1 age 55 exempt flows through SPM.
  period: 2026-01
  input:
    people:
      person1:
        age: 55
        weekly_hours_worked_before_lsr: 1
        is_disabled: false
    spm_units:
      spm_unit:
        members: [person1]
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: CA
  output:
    meets_snap_work_requirements: true

- name: Case 6, non-CA post-HR1 age 55 not exempt.
  period: 2026-01
  input:
    people:
      person1:
        age: 55
        weekly_hours_worked_before_lsr: 1
        is_disabled: false
    spm_units:
      spm_unit:
        members: [person1]
    tax_units:
      tax_unit:
        members: [person1]
    households:
      household:
        members: [person1]
        state_code: TX
  output:
    meets_snap_work_requirements: false

- name: Case 7, sanctioned member (general work requirement hook set to false) is disqualified individually.
  period: 2024-01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 30
        is_disabled: false
      person2:
        age: 30
        weekly_hours_worked_before_lsr: 30
        is_disabled: false
        meets_snap_general_work_requirements: false
    spm_units:
      spm_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    meets_snap_work_requirements_person: [true, false]
    meets_snap_work_requirements: true

- name: Case 8, unit is ineligible when all members fail the work requirements.
  period: 2026-01
  input:
    people:
      person1:
        age: 35
        weekly_hours_worked_before_lsr: 0
        is_disabled: false
      person2:
        age: 30
        weekly_hours_worked_before_lsr: 0
        is_disabled: false
    spm_units:
      spm_unit:
        members: [person1, person2]
    tax_units:
      tax_unit:
        members: [person1, person2]
    households:
      household:
        members: [person1, person2]
        state_code: TX
  output:
    meets_snap_work_requirements_person: [false, false]
    meets_snap_work_requirements: false
