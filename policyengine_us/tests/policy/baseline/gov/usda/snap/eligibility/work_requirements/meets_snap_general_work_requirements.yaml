# 7 CFR 273.7 — General work requirements.
# The general requirement is to register for work and accept suitable
# employment. Working under 30 hours per week is not disqualifying:
# 30+ hours of work is exemption 273.7(b)(1)(vii) FROM registration,
# not a compliance test. Disqualification requires an affirmative
# noncompliance event (refusal of suitable employment or E&T
# noncompliance under 273.7(f); voluntary quit under 273.7(j)), which
# is unobservable in survey data — the baseline assumes registration
# compliance, so this variable defaults to true for everyone. It is a
# hook for sanction modeling.

- name: Case 1, non-exempt unemployed adult is NOT disqualified absent a sanction.
  period: 2022
  input:
    age: 30
    weekly_hours_worked_before_lsr: 0
    is_disabled: false
    is_incapable_of_self_care: false
  output:
    meets_snap_general_work_requirements: true

- name: Case 2, adult working 29 hours per week is compliant.
  period: 2022
  input:
    age: 30
    weekly_hours_worked_before_lsr: 29
    is_disabled: false
    is_incapable_of_self_care: false
  output:
    meets_snap_general_work_requirements: true

- name: Case 3, exempt person (age 60) is compliant.
  period: 2022
  input:
    age: 60
    weekly_hours_worked_before_lsr: 1
    is_disabled: false
    is_incapable_of_self_care: false
  output:
    meets_snap_general_work_requirements: true

- name: Case 4, sanction hook — an affirmative noncompliance event can be set as an input.
  period: 2022
  input:
    age: 30
    meets_snap_general_work_requirements: false
  output:
    meets_snap_general_work_requirements: false
